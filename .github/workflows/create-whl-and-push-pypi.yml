name: Build and Publish wheels

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "构建完成后自动上传到 PyPI？"
        type: boolean
        default: false
        required: false

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          #- macos-latest
          # 如果你确实有这些 runner 才保留，否则删掉
          - ubuntu-24.04-arm
          #- windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Debug - Check Git tags (optional)
        shell: bash
        run: |
          echo "=== Git tags ==="
          git tag || true
          echo "=== Current version from git describe ==="
          git describe --tags --abbrev=0 || echo "No tags found"
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          # 先收敛到常用版本，避免 3.13+ 造成额外不稳定
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"

          # 不构建 32-bit / musllinux
          CIBW_SKIP: "*-win32 *-musllinux_*"

          # ✅ 关键：pin 构建工具链，避免 Dynamic: license-file
          CIBW_BEFORE_BUILD: >
            python -m pip install -U "pip<26" "setuptools<82" wheel build
          # 你的优化参数（可选）
          CIBW_ENVIRONMENT: 'CFLAGS="-O2" CXXFLAGS="-O2" LDFLAGS="-s"'
          CIBW_ENVIRONMENT_WINDOWS: 'CL="/O2"'

          # 如果你想做最小 import 测试（不连库）
          # CIBW_TEST_COMMAND: 'python -c "import yaspy; print(yaspy.apilevel)"'

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ github.run_id }}
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build_wheels
    if: github.event.inputs.publish_to_pypi == 'true'

    steps:
      - name: Download all wheels artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: wheels-*-${{ github.run_id }}
          merge-multiple: true

      - name: Collect wheels into dist/
        shell: bash
        run: |
          mkdir -p dist
          find all-wheels -name "*.whl" -type f -exec cp {} dist/ \;
          echo "=== wheels in dist/ ==="
          ls -la dist/
          echo "=== count ==="
          ls dist/*.whl 2>/dev/null | wc -l
      - name: Install twine (pinned toolchain)
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -U twine packaging
          twine --version
      - name: Upload to PyPI
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$(ls dist/*.whl 2>/dev/null)" ]; then
            echo "❌ 没有找到任何 wheel 文件"
            exit 1
          fi
          twine upload \
            --repository-url https://upload.pypi.org/legacy/ \
            --skip-existing \
            --verbose \
            dist/*.whl
      - name: Publish done
        if: success()
        shell: bash
        run: |
          echo "✅ 成功上传到 PyPI"
          echo "查看: https://pypi.org/project/yaspy/"
